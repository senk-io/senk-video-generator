name: 测试

on:
  push:
    branches: [bakboem-dev]
  pull_request:
    branches: [bakboem-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 单元与迁移测试
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: 安装测试依赖
        run: python -m pip install -r requirements-test.txt

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 运行迁移测试
        run: python -m unittest discover -s migration_tests -v
