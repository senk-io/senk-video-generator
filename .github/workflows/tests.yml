name: 测试

on:
  push:
    branches: [bakboem-dev]
  pull_request:
    branches: [bakboem-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 单元与迁移测试
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-provider-compat.txt
            requirements-test.txt

      - name: 安装提供者兼容依赖
        run: python -m pip install -r requirements-provider-compat.txt

      - name: 验证提供者导入链
        run: |
          python - <<'PY'
          from diffusers import AutoencoderKLCogVideoX, CogVideoXPipeline, CogVideoXTransformer3DModel, WanPipeline
          from diffusers.schedulers import CogVideoXDDIMScheduler, UniPCMultistepScheduler
          from transformers import AutoTokenizer, T5EncoderModel, UMT5EncoderModel
          print("CogVideoX 与 Wan 提供者导入链通过")
          PY

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 运行迁移测试
        run: python -m unittest discover -s migration_tests -v
